version: '3.8'

services:
  # ============================================================
  # 前端
  # ============================================================
  frontend:
    build:
      context: ../XnetDataops-web
      dockerfile: ../XnetDataops/deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - usr-service
      - dsm-service
      - dim-service
      - ddv-service
      - tsk-service
      - dqm-service
      - dgv-service
      - das-service
      - dap-service
      - dms-service
      - dob-service
      - dau-service
    networks:
      - dataops-net

  # ============================================================
  # 后端微服务
  # ============================================================
  usr-service:
    build:
      context: ./dataops-usr-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9287:9287"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - dataops-net

  dsm-service:
    build:
      context: ./dataops-dsm-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9281:9281"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - XNET_DATASOURCE_RECOMMENDATION_PASSWORD=${RECOMMENDATION_DATAOPS_DB_PASSWORD:?RECOMMENDATION_DATAOPS_DB_PASSWORD is required}
      - XNET_DATASOURCE_ALLOWED_HOSTS=${RECOMMENDATION_PG_HOST:-recommendation-postgres}
    depends_on:
      - mysql
    networks:
      - dataops-net

  dim-service:
    build:
      context: ./dataops-dim-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9282:9282"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  ddv-service:
    build:
      context: ./dataops-ddv-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9283:9283"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  tsk-service:
    build:
      context: ./dataops-tsk-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9284:9284"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - RECOMMENDATION_PG_URL=jdbc:postgresql://${RECOMMENDATION_PG_HOST:-recommendation-postgres}:${RECOMMENDATION_PG_PORT:-5432}/${RECOMMENDATION_PG_DATABASE:-recommendation}
      - RECOMMENDATION_DATAOPS_DB_USERNAME=${RECOMMENDATION_DATAOPS_DB_USERNAME:-recommendation_dataops}
      - RECOMMENDATION_DATAOPS_DB_PASSWORD=${RECOMMENDATION_DATAOPS_DB_PASSWORD:?RECOMMENDATION_DATAOPS_DB_PASSWORD is required}
    depends_on:
      - mysql
      - recommendation-postgres
    networks:
      - dataops-net

  dqm-service:
    build:
      context: ./dataops-dqm-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9285:9285"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  dgv-service:
    build:
      context: ./dataops-dgv-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9286:9286"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  das-service:
    build:
      context: ./dataops-das-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9288:9288"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  dap-service:
    build:
      context: ./dataops-dap-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9289:9289"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  dms-service:
    build:
      context: ./dataops-dms-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9290:9290"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  dob-service:
    build:
      context: ./dataops-dob-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9291:9291"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  dau-service:
    build:
      context: ./dataops-dau-service
      dockerfile: ../deploy/Dockerfile
    ports:
      - "9292:9292"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/XnetDataops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    depends_on:
      - mysql
    networks:
      - dataops-net

  # ============================================================
  # 基础设施
  # ============================================================
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=XnetDataops
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/xnet_dataops_ddl.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - dataops-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dataops-net

  recommendation-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${RECOMMENDATION_PG_DATABASE:-recommendation}
      - POSTGRES_PASSWORD=${RECOMMENDATION_POSTGRES_ADMIN_PASSWORD:?RECOMMENDATION_POSTGRES_ADMIN_PASSWORD is required}
      - RECOMMENDATION_DATAOPS_DB_PASSWORD=${RECOMMENDATION_DATAOPS_DB_PASSWORD:?RECOMMENDATION_DATAOPS_DB_PASSWORD is required}
      - RECOMMENDATION_MLOPS_DB_PASSWORD=${RECOMMENDATION_MLOPS_DB_PASSWORD:?RECOMMENDATION_MLOPS_DB_PASSWORD is required}
    volumes:
      - recommendation-pg-data:/var/lib/postgresql/data
      - ./recommendation-data-product/sql/001_raw_schema.sql:/docker-entrypoint-initdb.d/001_raw_schema.sql:ro
      - ./recommendation-data-product/sql/003_security_roles.sql:/docker-entrypoint-initdb.d/003_security_roles.sql:ro
      - ./recommendation-data-product/sql/004_provision_app_users.sh:/docker-entrypoint-initdb.d/004_provision_app_users.sh:ro
    networks:
      - dataops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${RECOMMENDATION_PG_DATABASE:-recommendation}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  recommendation-pg-data:

networks:
  dataops-net:
    driver: bridge
