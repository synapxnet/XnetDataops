upstream usr-service {
    server 127.0.0.1:9287;
}
upstream dsm-service {
    server 127.0.0.1:9281;
}
upstream dim-service {
    server 127.0.0.1:9282;
}
upstream ddv-service {
    server 127.0.0.1:9283;
}
upstream tsk-service {
    server 127.0.0.1:9284;
}
upstream dqm-service {
    server 127.0.0.1:9285;
}
upstream dgv-service {
    server 127.0.0.1:9286;
}
upstream das-service {
    server 127.0.0.1:9288;
}
upstream dap-service {
    server 127.0.0.1:9289;
}
upstream dms-service {
    server 127.0.0.1:9290;
}
upstream dob-service {
    server 127.0.0.1:9291;
}
upstream dau-service {
    server 127.0.0.1:9292;
}

server {
    listen       80;
    server_name  localhost;

    # 内部组织范围校验，业务接口不相信客户端自声明的团队。
    location = /_organization_access {
        internal;
        proxy_pass http://usr-service:9287/api/usr/organization-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-Uid $http_x_tenant_uid;
        proxy_set_header X-Dept-Uid $http_x_dept_uid;
        proxy_set_header X-Team-Uid $http_x_team_uid;
    }

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
    gzip_vary on;

    # 入口文件禁止缓存，确保部署后立即加载最新资源清单。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /_app.config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 前端静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # USR - 用户管理 (9287)
    location /api/usr/ {
        proxy_pass http://usr-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DSM - 数据源管理 (9281)
    location /api/dsm/ {
        auth_request /_organization_access;
        proxy_pass http://dsm-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DIM - 数据集成 (9282)
    location /api/dim/ {
        auth_request /_organization_access;
        proxy_pass http://dim-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DDV - 数据开发 (9283)
    location /api/ddv/ {
        auth_request /_organization_access;
        proxy_pass http://ddv-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
    }

    # TSK - 任务调度 (9284)
    location /api/tsk/ {
        auth_request /_organization_access;
        proxy_pass http://tsk-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DQM - 数据质量 (9285)
    location /api/dqm/ {
        auth_request /_organization_access;
        proxy_pass http://dqm-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DGV - 数据治理 (9286)
    location /api/dgv/ {
        auth_request /_organization_access;
        proxy_pass http://dgv-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DAS - 数据资产 (9288)
    location /api/das/ {
        auth_request /_organization_access;
        proxy_pass http://das-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DAP - 数据API (9289)
    location /api/dap/ {
        auth_request /_organization_access;
        proxy_pass http://dap-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DMS - 数据脱敏 (9290)
    location /api/dms/ {
        auth_request /_organization_access;
        proxy_pass http://dms-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DOB - 数据可观测性 (9291)
    location /api/dob/ {
        auth_request /_organization_access;
        proxy_pass http://dob-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # DAU - 数据审计 (9292)
    location /api/dau/ {
        auth_request /_organization_access;
        proxy_pass http://dau-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
