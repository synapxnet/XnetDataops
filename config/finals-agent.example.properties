# 委托和审批凭据由服务端注入；空值拒绝受保护请求。
# Supply delegated-token and approval credentials server-side; empty values deny protected requests.
openxnet.agent.delegation-secret=
openxnet.agent.audience=openxnet-agent-adapter
openxnet.approval.base-url=http://127.0.0.1:8080
openxnet.approval.service-token=
openxnet.dataops.usr-base-url=
openxnet.dataops.resource-scopes-json=[]

# 可选只读量化产品连接 / Optional read-only quantitative product connection.
xnet.quantitative.jdbc-url=
xnet.quantitative.username=
xnet.quantitative.password=

# 仅一次性迁移；使用当前已审核导出和匹配摘要，不填入公开示例状态。
# One-shot migration requires a reviewed current export and matching digest; do not publish runtime state.
goai.resource-state-migration-file=
goai.resource-state-migration-sha256=
