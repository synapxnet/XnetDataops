# 填写可信USR地址后仍需USR精确返回204。 Set a trusted USR base URL; only its exact HTTP 204 grants access.
openxnet.dataops.usr-base-url=

# 默认不授予任何工作空间/组织映射。 No workspace or organization grants are enabled by default.
openxnet.dataops.resource-scopes-json=[]

