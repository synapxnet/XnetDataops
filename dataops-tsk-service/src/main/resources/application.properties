spring.application.name=dataops-tsk-service
server.port=9284

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/XnetDataops?useSSL=false&serverTimezone=UTC&autoReconnect=true&failOverReadOnly=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

mybatis.configuration.map-underscore-to-camel-case=true

logging.level.root=info
logging.level.com.synapxnet=debug

# 推荐数据产品使用独立 PostgreSQL，凭据通过部署环境注入。
xnet.recommendation.jdbc-url=${RECOMMENDATION_PG_URL:jdbc:postgresql://127.0.0.1:55432/recommendation}
xnet.recommendation.username=${RECOMMENDATION_DATAOPS_DB_USERNAME:recommendation_dataops}
xnet.recommendation.password=${RECOMMENDATION_DATAOPS_DB_PASSWORD:}
